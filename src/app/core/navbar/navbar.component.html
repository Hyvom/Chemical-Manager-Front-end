<nav class="navbar">
  <div class="navbar-brand">
    <a routerLink="/home" class="brand">CNSTN Chemical Manager</a>
  </div>
  <ul class="navbar-links">
    <!-- Links visible only when authenticated -->
    <li *ngIf="isAuthenticated">
      <a routerLink="/home" routerLinkActive="active">Accueil</a>
    </li>
    <li *ngIf="isAuthenticated">
      <a routerLink="/products" routerLinkActive="active">Produits</a>
    </li>
    <li *ngIf="isAuthenticated">
      <a routerLink="/requests" routerLinkActive="active">Demandes</a>
    </li>

    <!-- Admin-only link -->
    <li *ngIf="isAuthenticated && isAdmin">
      <a routerLink="/users" routerLinkActive="active">Utilisateurs</a>
    </li>

    <!-- Show login/register only when NOT authenticated -->
    <li *ngIf="!isAuthenticated">
      <a routerLink="/login" routerLinkActive="active">Connexion</a>
    </li>
    <li *ngIf="!isAuthenticated">
      <a routerLink="/register" routerLinkActive="active">Inscription</a>
    </li>

    <!-- Show logout only when authenticated -->
    <li *ngIf="isAuthenticated">
      <a (click)="logout()" style="cursor: pointer;">Déconnexion</a>
    </li>
  </ul>
</nav>
