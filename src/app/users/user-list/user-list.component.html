<div class="user-list">
  <h2>User Management</h2>
  <div *ngIf="loading">Loading...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <table *ngIf="!loading && users.length > 0" class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>Status</th>
        <th>Actions (Admin Only)</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.enabled ? 'Enabled' : 'Disabled' }}</td>
        <td>
          <button (click)="enableUser(user)" [disabled]="user.enabled">Enable</button>
          <button (click)="disableUser(user)" [disabled]="!user.enabled">Disable</button>
          <button (click)="updateUser(user)">Update</button>
          <button (click)="deleteUser(user)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div *ngIf="!loading && users.length === 0">No users found.</div>
</div>
